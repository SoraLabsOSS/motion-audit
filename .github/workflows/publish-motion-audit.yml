name: Publish Motion Audit to npm

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-motion-audit
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/motion-audit/package.json').version")
          TAG_VERSION="${TAG_NAME#v}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG_NAME does not match @soralasbs/motion-audit version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Run Motion Audit tests
        run: bun test packages/motion-audit/tests

      - name: Build Motion Audit
        run: bun run --cwd packages/motion-audit build

      - name: Publish package
        working-directory: packages/motion-audit
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
